name: Preparar Macumu Global e gerar APK

on:
push:
branches:
- main

workflow_dispatch:

permissions:
contents: read

concurrency:
group: macumu-global-build
cancel-in-progress: true

jobs:
preparar-apk:
runs-on: ubuntu-latest

steps:
  - name: Obter código do projecto
    uses: actions/checkout@v4

  - name: Configurar Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v4

  - name: Aceitar licenças Android
    run: yes | sdkmanager --licenses || true

  - name: Instalar Gradle 9.3.1
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'

  - name: Verificar projecto
    run: |
      echo "A verificar Macumu Global..."

      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts

      echo "Estrutura do projecto encontrada."

  - name: Gerar certificado Debug
    run: |
      if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
        keytool -genkeypair -v \
          -keystore "$GITHUB_WORKSPACE/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi

      echo "Certificado Debug preparado."

  - name: Compilar APK
    run: |
      gradle --no-daemon --stacktrace :app:assembleDebug

  - name: Disponibilizar APK
    uses: actions/upload-artifact@v4
    with:
      name: Macumu-Global-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
