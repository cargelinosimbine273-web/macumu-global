name: Preparar APK - Macumu Global

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Macumu Global
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar pacotes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      - name: Gerar assinatura Debug
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verificar Keystore
        run: |
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
