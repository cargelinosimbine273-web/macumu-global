name: Macumu Global - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Macumu Global
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar pacotes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      - name: Verificar assinatura Debug persistente
        run: |
          test -s "$GITHUB_WORKSPACE/debug.keystore"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK-Android-7-Plus
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
