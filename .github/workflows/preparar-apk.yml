name: Preparar Macumu Global e gerar APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'README.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macumu-global-build
  cancel-in-progress: true

jobs:
  preparar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código do projecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar estrutura do projecto
        run: |
          echo "Verificando ficheiros do Macumu Global..."

          if [ ! -f "settings.gradle.kts" ]; then
            echo "Erro: settings.gradle.kts não encontrado."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "Erro: app/build.gradle.kts não encontrado."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "Erro: Gradle Wrapper não encontrado."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar aplicação Android
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
