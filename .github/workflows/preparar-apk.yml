name: Macumu Global - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Macumu Global
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar pacotes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      - name: Localizar projecto e assinatura
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" \
              -name settings.gradle.kts \
              -type f -print -quit | xargs dirname)"
          fi

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: projecto Gradle nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projecto localizado em: $PROJECT_DIR"

          if [ ! -s "$PROJECT_DIR/debug.keystore" ]; then
            echo "ERRO: debug.keystore nao encontrado."
            exit 1
          fi

          keytool -list \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK-Android-7-Plus
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
