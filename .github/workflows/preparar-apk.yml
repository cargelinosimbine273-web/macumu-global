name: Macumu Global - Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macumu-global-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar-apk:
    name: Verificar, testar e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 01 - Checkout do projecto
        uses: actions/checkout@v4

      - name: 02 - Verificar estrutura Android
        shell: bash
        run: |
          set -euo pipefail

          echo "A verificar Macumu Global..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Estrutura Android confirmada."
          echo "Gradle Wrapper não será necessário."

      - name: 03 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 04 - Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 05 - Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses || true

      - name: 06 - Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 07 - Verificar ferramentas
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          sdkmanager --list_installed

      - name: 08 - Limpar projecto
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

      - name: 09 - Executar testes unitários
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: 10 - Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: 11 - Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK criado:"
          ls -lh "$APK"

      - name: 12 - Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 13 - Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-Relatorios
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
