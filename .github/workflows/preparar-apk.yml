name: Macumu Global - Compilar e testar instalacao Android 13

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macumu-global-build-install
  cancel-in-progress: true

jobs:
  build-and-install-test:
    name: Build APK e teste real de instalacao
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK usado pelo projecto
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36-ext1" \
            "build-tools;36.0.0"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Gerar assinatura Debug
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verificar assinatura e metadados
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK" | tee apk-badging.txt

          grep -q \
            "package: name='com.aistudio.macumuglobal.hqvkrz'" \
            apk-badging.txt

          grep -q "sdkVersion:'24'" apk-badging.txt

      - name: Instalar e abrir APK no Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true

          script: |
            set -o pipefail

            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

            PACKAGE="com.aistudio.macumuglobal.hqvkrz"

            adb install -r "$APK" 2>&1 | tee install-result.txt || {
              adb logcat -d -t 500 > install-logcat.txt || true
              exit 1
            }

            adb shell monkey -p "$PACKAGE" 1 \
              2>&1 | tee launch-result.txt

            sleep 15

            adb shell pidof "$PACKAGE" > app-pid.txt || {
              adb logcat -d -t 800 > launch-logcat.txt || true
              echo "A aplicacao foi instalada mas nao permaneceu activa."
              exit 1
            }

            adb logcat -d -t 800 > launch-logcat.txt

            echo "PASS: APK instalado e processo activo no Android 13/API 33."

      - name: Disponibilizar APK e diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK-e-Diagnostico-Instalacao
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            install-result.txt
            install-logcat.txt
            launch-result.txt
            app-pid.txt
            launch-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
