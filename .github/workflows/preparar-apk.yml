name: Macumu Global - Extrair ZIP e Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macumu-global-build
  cancel-in-progress: true

jobs:
  build:
    name: Preparar projeto e compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: 2. Encontrar e extrair o ZIP do Macumu Global
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Macumu-Global-Projeto-Completo-Pronto-para-GitHub.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP nao encontrado na raiz do repositorio."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/macumu-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/macumu-source"

          SRC="$RUNNER_TEMP/macumu-source"

          if [ ! -f "$SRC/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle.kts nao encontrado."
            find "$SRC" -maxdepth 3 -type f | head -80
            exit 1
          fi

          rsync -a --exclude='.github/' "$SRC/" "$GITHUB_WORKSPACE/"

          echo "Projeto extraido com sucesso."

      - name: 3. Verificar estrutura Android
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Estrutura Android encontrada."

      - name: 4. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5. Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 6. Instalar plataforma Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: 7. Preparar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 8. Preparar certificado de depuracao
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 9. Compilar e executar testes
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: 10. Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 11. Guardar relatorios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-Relatorios-Testes
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
