name: Macumu Global - Compilar e testar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macumu-global-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar instalacao
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Criar assinatura Debug
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK" > apk-badging.txt

          cat apk-badging.txt

          grep -q "com.aistudio.macumuglobal.hqvkrz" apk-badging.txt

      - name: Testar instalacao no Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e

            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

            PACKAGE="com.aistudio.macumuglobal.hqvkrz"

            adb install "$APK"

            adb shell monkey -p "$PACKAGE" 1

            sleep 10

            adb shell pidof "$PACKAGE"

            echo "APK instalado e iniciado no emulador Android 13."

      - name: Guardar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-Diagnosticos
          path: |
            apk-badging.txt
          if-no-files-found: ignore
          retention-days: 14
