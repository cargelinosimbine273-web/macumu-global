name: Macumu Global - Build Android APK

# 1. EVENTOS DE EXECUCAO
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2. PERMISSOES
permissions:
  contents: read

# 3. CONTROLO DE EXECUCOES
concurrency:
  group: macumu-global-build
  cancel-in-progress: true

# 4. JOB PRINCIPAL
jobs:
  preparar-apk:
    name: Compilar Macumu Global
    runs-on: ubuntu-latest

    steps:

      # ETAPA 1 - OBTER CODIGO
      - name: 01 - Obter codigo do projecto
        uses: actions/checkout@v4

      # ETAPA 2 - CONFIGURAR JAVA
      - name: 02 - Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ETAPA 3 - CONFIGURAR ANDROID SDK
      - name: 03 - Configurar Android SDK
        uses: android-actions/setup-android@v4

      # ETAPA 4 - ACEITAR LICENCAS
      - name: 04 - Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      # ETAPA 5 - INSTALAR GRADLE
      - name: 05 - Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ETAPA 6 - VERIFICAR PROJECTO
      - name: 06 - Verificar estrutura do projecto
        run: |
          echo "A verificar Macumu Global..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Estrutura validada."

      # ETAPA 7 - GERAR CERTIFICADO DEBUG
      - name: 07 - Gerar certificado Debug
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "A gerar certificado Debug..."

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Certificado Debug preparado."

      # ETAPA 8 - COMPILAR APLICACAO
      - name: 08 - Compilar Macumu Global APK
        run: |
          echo "A iniciar compilacao..."

          gradle --no-daemon --stacktrace :app:assembleDebug

          echo "Compilacao concluida."

      # ETAPA 9 - VERIFICAR APK
      - name: 09 - Verificar APK gerado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      # ETAPA 10 - DISPONIBILIZAR APK
      - name: 10 - Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
