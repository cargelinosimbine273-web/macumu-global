name: Macumu Global - Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macumu-global-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar-apk:

    name: Verificar, testar e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # 1. Obter o código do repositório
      - name: 01 - Checkout do projecto
        uses: actions/checkout@v4

      # 2. Confirmar a estrutura Android
      - name: 02 - Verificar estrutura Android
        shell: bash
        run: |
          set -euo pipefail

          echo "A verificar a estrutura do Macumu Global..."

          test -f settings.gradle.kts || {
            echo "ERRO: settings.gradle.kts não encontrado."
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERRO: build.gradle.kts não encontrado."
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERRO: app/build.gradle.kts não encontrado."
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERRO: gradle-wrapper.properties não encontrado."
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.jar || {
            echo "ERRO: gradle-wrapper.jar não encontrado."
            exit 1
          }

          test -f gradlew || {
            echo "ERRO: gradlew não encontrado."
            exit 1
          }

          echo "Estrutura Android confirmada."
          echo "Não é necessário procurar ZIP."

      # 3. Configurar Java
      - name: 03 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Android SDK
      - name: 04 - Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar componentes Android
      - name: 05 - Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses || true

          echo "Android SDK preparado."

      # 6. Preparar Gradle Wrapper
      - name: 06 - Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Versão do Gradle Wrapper:"
          ./gradlew --version

      # 7. Verificar ambiente
      - name: 07 - Verificar Java e Android
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo "SDK Android:"
          sdkmanager --list_installed

      # 8. Limpar projecto
      - name: 08 - Limpar projecto
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon clean

      # 9. Executar testes unitários
      - name: 09 - Executar testes unitários
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      # 10. Compilar APK Debug
      - name: 10 - Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # 11. Confirmar APK
      - name: 11 - Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado com sucesso:"
          ls -lh "$APK"

      # 12. Disponibilizar APK
      - name: 12 - Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Guardar relatórios
      - name: 13 - Guardar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-Relatorios-Testes
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
