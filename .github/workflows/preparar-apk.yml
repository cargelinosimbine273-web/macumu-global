name: Macumu Global - Build Android APK

# 1. EVENTOS DE EXECUCAO
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2. PERMISSOES
permissions:
  contents: read

# 3. CONTROLO DE EXECUCOES
concurrency:
  group: macumu-global-build
  cancel-in-progress: true

# 4. JOB PRINCIPAL
jobs:
  preparar-apk:
    name: Compilar Macumu Global
    runs-on: ubuntu-latest

    steps:

      # ETAPA 1 - OBTER CODIGO
      - name: 01 - Obter codigo do projecto
        uses: actions/checkout@v4

      # ETAPA 2 - CONFIGURAR JAVA
      - name: 02 - Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ETAPA 3 - CONFIGURAR ANDROID SDK
      - name: 03 - Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      # ETAPA 4 - ACEITAR LICENCAS
      - name: 04 - Aceitar licencas Android
        run: yes | sdkmanager --licenses

      # ETAPA 5 - INSTALAR GRADLE
      - name: 05 - Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ETAPA 6 - VERIFICAR PROJECTO
      - name: 06 - Verificar estrutura do projecto
        run: |
          echo "A verificar Macumu Global..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Estrutura validada."

      # ETAPA 7 - GERAR CERTIFICADO DEBUG
      - name: 07 - Gerar certificado Debug
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "A gerar certificado Debug..."

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Certificado Debug preparado."

      # ETAPA 8 - COMPILAR APLICACAO
      - name: 08 - Confirmar versoes do ambiente
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36.1|build-tools;36.0.0'

      # ETAPA 9 - COMPILAR E EXECUTAR TESTES UNITARIOS
      - name: 09 - Compilar APK e executar testes unitarios
        run: |
          echo "A iniciar compilacao e testes unitarios..."
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          echo "Compilacao e testes unitarios concluidos."

      # ETAPA 9 - VERIFICAR APK
      - name: 09 - Verificar APK gerado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      # ETAPA 11 - DISPONIBILIZAR APK
      - name: 11 - Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # RELATORIOS DE TESTE DISPONIVEIS MESMO QUANDO A COMPILACAO FALHA
      - name: 12 - Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Macumu-Global-Relatorios-Testes
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
